name: Extract latest hero video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-latest-hero-video.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original full-quality video from ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trueprint-latest-video
          unzip -oq 'assets/Seamless_infinite_motion_video_loop_988a4740_1080p.mp4.zip' -d /tmp/trueprint-latest-video
          video="$(find /tmp/trueprint-latest-video -type f -iname '*.mp4' ! -path '*/__MACOSX/*' ! -name '._*' -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$video"
          test "$(stat -c%s "$video")" -gt 100000
          python3 - "$video" <<'PY'
          import sys
          path=sys.argv[1]
          with open(path,'rb') as f: head=f.read(24)
          if head[4:8]!=b'ftyp':
              raise SystemExit('Uploaded file is not a real MP4')
          PY
          cp "$video" 'assets/trueprint_hero_motion_1080p.mp4'
          cmp "$video" 'assets/trueprint_hero_motion_1080p.mp4'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/trueprint_hero_motion_1080p.mp4'
          if ! git diff --cached --quiet; then
            git commit -m "Extract original full-quality 1080p hero MP4"
            git push
          fi
